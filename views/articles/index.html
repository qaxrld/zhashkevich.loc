<h1>{{h1}}</h1>
<ul class="flex-box">
  {% for article in articles %}
  <li class="article">
    <h2>{{ article.get_name() }}</h2>
    <p>{{ article.get_text() }}</p>
    <p>{{ article.get_id() }}</p>
    <a href="article/{{article.get_id()}}">Подробнее</a>
    <a href="article/{{article.get_id()}}/edit">Редактировать</a>
    <a href="article/{{article.get_id()}}/delete">Удалить</a>
  </li>
  <hr>
  {% endfor %}
</ul>
