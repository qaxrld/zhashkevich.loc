<h1>{{h1}}</h1>
<ul class="flex-box">
  {% for article in articles %}
  <li class="article">
    <h2>{{ article.get_name() }}</h2>
    <p>{{ article.get_text() }}</p>
    <p>{{ article.get_author().get_nickname() }}</p>
    <p>{{ article.get_id() }}</p>
    <a href="article/{{article.get_id()}}">Подробнее</a>
{% if user and user.get_id() == article.get_author_id() %}
    <a href="/article/{{article.get_id()}}/edit">Редактировать</a>
    <form action="/article/{{article.get_id()}}/delete" method="POST" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Удалить</button>
    </form>
    {% endif %}
  </li>
  <hr>
  {% endfor %}
</ul>
